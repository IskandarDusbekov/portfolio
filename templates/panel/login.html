<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panelga kirish | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #e2e8f0;
            background:
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.30), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(14, 165, 233, 0.25), transparent 35%),
                linear-gradient(160deg, #0b1224 0%, #0f1b38 55%, #0a1120 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 18px;
            padding: 2rem 1.8rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            font-size: 1.35rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: .35rem;
        }
        .brand i {
            background: linear-gradient(135deg, #3b82f6, #0ea5e9);
            width: 42px; height: 42px;
            border-radius: 12px;
            display: grid; place-items: center;
            font-size: 1.1rem;
        }
        .subtitle { text-align: center; color: #94a3b8; font-size: .9rem; margin-bottom: 1.6rem; }
        .field { margin-bottom: 1rem; }
        .field label {
            display: block;
            font-size: .82rem;
            color: #cbd5e1;
            margin-bottom: .35rem;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute;
            left: .85rem; top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: .9rem;
        }
        .input-wrap input {
            width: 100%;
            padding: .8rem .9rem .8rem 2.4rem;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 11px;
            color: #f1f5f9;
            font-size: .95rem;
            transition: border-color .18s, box-shadow .18s;
        }
        .input-wrap input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .btn-submit {
            width: 100%;
            margin-top: .4rem;
            padding: .85rem;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: #fff;
            font-size: .98rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            transition: transform .12s, box-shadow .18s;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(37, 99, 235, 0.4); }
        .error {
            background: rgba(220, 38, 38, 0.14);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
            padding: .7rem .85rem;
            border-radius: 10px;
            font-size: .85rem;
            margin-bottom: 1.1rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .foot { text-align: center; margin-top: 1.4rem; }
        .foot a { color: #93c5fd; text-decoration: none; font-size: .84rem; }
        .foot a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <form class="login-card" method="post" action="{% url 'panel:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />

        <div class="brand"><i class="fas fa-gauge-high"></i> Control Panel</div>
        <p class="subtitle">Boshqaruv paneliga kirish</p>

        {% if error %}
        <div class="error"><i class="fas fa-circle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <div class="field">
            <label for="id_username">Login</label>
            <div class="input-wrap">
                <i class="fas fa-user"></i>
                <input id="id_username" type="text" name="username" autocomplete="username" autofocus required />
            </div>
        </div>

        <div class="field">
            <label for="id_password">Parol</label>
            <div class="input-wrap">
                <i class="fas fa-lock"></i>
                <input id="id_password" type="password" name="password" autocomplete="current-password" required />
            </div>
        </div>

        <button class="btn-submit" type="submit"><i class="fas fa-right-to-bracket"></i> Kirish</button>

        <div class="foot"><a href="{% url 'index' %}"><i class="fas fa-arrow-left"></i> Saytga qaytish</a></div>
    </form>
</body>
</html>
